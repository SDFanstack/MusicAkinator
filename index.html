<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElixirMix — Adivina la canción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene">
    <header class="header">
      <div class="brand">
        <svg class="brand__flame" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4c3 8-4 11-4 18 0 5 3 8 3 8s-9-2-9-12c-6 6-8 13-8 19 0 12 9 21 21 21s21-9 21-21c0-11-8-17-12-24 0 6-3 9-3 13 0 3 2 5 2 5s-11-1-11-27z" fill="none" stroke="url(#flameGrad)" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M27 34v14a5 5 0 1 0 3 4.5V38l8-2v10.5a5 5 0 1 0 3 4.5V30l-14 4z" fill="url(#flameGrad)"/>
          <defs>
            <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff9d4d"/>
              <stop offset="1" stop-color="#e21b32"/>
            </linearGradient>
          </defs>
        </svg>
        <h1 class="brand__name">ElixirMix</h1>
      </div>
      <p class="brand__tag" id="trackCount">Adivina la canción de tu lista</p>
    </header>

    <main class="card" id="card">

      <section class="stage" id="stage">
        <div class="player" id="player">
          <iframe
            id="playerFrame"
            title="Reproductor de Spotify"
            width="100%"
            height="152"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>
          <div class="overlay" id="overlay">
            <svg class="overlay__flame" viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 4c3 8-4 11-4 18 0 5 3 8 3 8s-9-2-9-12c-6 6-8 13-8 19 0 12 9 21 21 21s21-9 21-21c0-11-8-17-12-24 0 6-3 9-3 13 0 3 2 5 2 5s-11-1-11-27z" fill="none" stroke="url(#flameGrad2)" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M27 34v14a5 5 0 1 0 3 4.5V38l8-2v10.5a5 5 0 1 0 3 4.5V30l-14 4z" fill="url(#flameGrad2)"/>
              <defs>
                <linearGradient id="flameGrad2" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ff9d4d"/>
                  <stop offset="1" stop-color="#e21b32"/>
                </linearGradient>
              </defs>
            </svg>
            <p class="overlay__text">Escuchando…</p>
          </div>
        </div>

        <div class="attempts" id="attempts" aria-label="Fallos permitidos: 3">
          <span class="attempts__dot" data-dot="0"></span>
          <span class="attempts__dot" data-dot="1"></span>
          <span class="attempts__dot" data-dot="2"></span>
        </div>
      </section>

      <form class="guess" id="guessForm" autocomplete="off">
        <div class="guess__field">
          <input
            type="text"
            id="searchInput"
            placeholder="Título o artista…"
            aria-label="Escribe el título o el artista"
            disabled>
          <ul class="suggestions" id="suggestions"></ul>
        </div>
        <button type="submit" class="btn btn--ghost" id="guessBtn" disabled>Adivinar</button>
      </form>

      <p class="feedback" id="feedback"></p>

      <div class="controls">
        <button class="btn btn--start" id="startBtn">Empezar a escuchar</button>
        <button class="btn btn--start" id="nextBtn" hidden>Siguiente canción</button>
      </div>

      <dl class="stats" id="stats">
        <div><dt>Racha</dt><dd id="statRacha">0</dd></div>
        <div><dt>Mejor racha</dt><dd id="statMejor">0</dd></div>
        <div><dt>Aciertos</dt><dd id="statAciertos">0</dd></div>
      </dl>

    </main>

    <footer class="footer">
      <p>La lista se lee de <code>playlist.csv</code>. Para actualizarla, vuelve a exportarla desde Exportify y sustituye ese archivo.</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
